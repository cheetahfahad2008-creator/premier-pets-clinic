name: Publish to GitHub Pages

# Mirrors this branch to gh-pages, which GitHub Pages serves at
# https://cheetahfahad2008-creator.github.io/premier-pets-clinic/

on:
  push:
    branches: [claude/vet-clinic-website-4fqodf]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push this branch to gh-pages
        run: git push origin HEAD:gh-pages --force
